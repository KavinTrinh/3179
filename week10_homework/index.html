<!DOCTYPE html>
<html>
<head>
  <title>Australia Bushfire Analysis</title>
  
  <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>
  
  <link rel="stylesheet" type="text/css" href="css/styles.css" media="all">
</head>
<body>

  <h1>Australia Bushfire Dashboard</h1>

  <div id="vis1" class="chart-container"></div>

  <div id="vis2" class="chart-container"></div>


  <script type="text/javascript">
    var spec1 = "js/symbol_map_for_w9.vg.json";
    var spec2 = "js/interactive_chart_for_w10.vg.json";

    // Embed visualizations
    vegaEmbed('#vis1', spec1, { "actions": false });
    vegaEmbed('#vis2', spec2, { "actions": false });
  </script>

</body>
</html>
